<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16463a"><title>Rótulo Fácil</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icone/192.png"><link rel="apple-touch-icon" href="/icone/192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/utilities.min.css">
<script defer src="/app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:18px/1.55 "DM Sans",system-ui,sans-serif;color:#16372f;background:#f6f6ee}header{background:#16463a;color:white;padding:19px max(6vw,20px);font-weight:750;letter-spacing:-.04em;font-size:25px}.mark{color:#ffe183;margin-right:8px}main{width:min(900px,92%);margin:clamp(25px,6vw,65px) auto 80px}h1,h2,h3,p{margin:0 0 14px}h1,h2{line-height:1.14;letter-spacing:-.045em}h1{font-size:clamp(2.1rem,6vw,3.9rem)}h2{font-size:clamp(1.65rem,4vw,2.3rem)}button,select,input{font:inherit;border:1px solid #677e73;border-radius:12px;padding:12px;min-height:50px;max-width:100%;color:inherit;background:white}button{font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #005bbc;outline-offset:3px}.choices,.row{display:flex;gap:12px;flex-wrap:wrap}.choices{margin:28px 0}.choice{flex:1 1 280px;border:0;padding:30px;text-align:left;font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;display:grid;gap:28px;background:#ffe6a1}.choice:last-child{background:#cfe8d7}.symbol{font-size:42px}.panel,article{background:white;border:1px solid #c6d2c8;border-radius:18px;padding:clamp(17px,4vw,32px);margin:18px 0}article{border-top:7px solid #26725b;overflow-wrap:anywhere}label{display:block;font-weight:650;margin:15px 0 4px}select,input:not([type=range]){width:100%}input[type=range]{width:100%;accent-color:#16463a}button[aria-pressed=true],.primary{background:#16463a;color:white}.back{margin-bottom:20px}#status{margin-top:16px;font-weight:650}li{margin-bottom:6px}[hidden]{display:none!important}dialog{width:min(92%,500px);border:1px solid #73877b;border-radius:18px;padding:24px;color:inherit}dialog::backdrop{background:#112d25aa}#preview{max-height:250px;max-width:100%;display:block;margin:12px auto}button:hover{filter:brightness(.96)}.metric{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:bold;color:#16463a}.muted{color:#486056}#periods button{flex:1 1 78px}
</style></head><body><header><span class="mark" aria-hidden="true">◈</span>Rótulo Fácil</header><main>
<section id="home"><h1 tabindex="-1">O que você quer analisar?</h1><div class="choices"><button data-mode="energia" class="choice"><span class="symbol">⚡</span>Calcular Consumo de Energia</button><button data-mode="nutricao" class="choice"><span class="symbol">🥗</span>Analisar Tabela Nutricional</button></div></section>
<section id="work" hidden><button id="back" class="back">← Início</button><h1 id="title" tabindex="-1"></h1>
<div id="region" class="panel"><label for="uf">Qual é o seu estado?</label><select id="uf"></select><label for="rate">Valor exato da minha conta (R$/kWh, opcional)</label><input id="rate" inputmode="decimal" placeholder="Ex.: 0,95"><p id="reference" class="muted"></p></div>
<div class="panel"><h2>Fotografe a etiqueta</h2><p id="tip"></p><div class="row"><button id="snap" class="primary">📷 Tirar foto</button><button id="pick">Escolher da galeria</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="gallery" type="file" accept="image/*" hidden>
<div id="confirmPhoto" hidden><img id="preview" alt="Prévia da foto selecionada"><p>Ao analisar, a foto é enviada à OpenAI para leitura.</p><button id="analyze" class="primary">Analisar foto</button></div></div>
<div id="controls" class="panel" hidden><label for="hours">Horas ligado por dia · <output id="hoursLabel"></output></label><input id="hours" type="range" min="0" max="24" step=".25"><p id="basis"></p><h3>Ver consumo por período</h3><div id="periods" class="row"></div></div>
<div id="resultBox" hidden><article id="result" tabindex="-1"></article><div class="row" id="resultActions"></div><p><button id="add" class="primary" hidden>+ Adicionar este alimento à minha tabela de refeição</button></p></div>
<section id="mealBox" hidden><article id="meal"></article><div id="mealActions" class="row"></div><div id="editMeal" class="panel"></div></section>
</section><p role="status" id="status"></p>
<dialog id="clearDialog" aria-labelledby="clearTitle"><h2 id="clearTitle">Limpar a refeição?</h2><p>Os alimentos adicionados serão removidos deste aparelho.</p><form method="dialog" class="row"><button value="cancel" autofocus>Manter refeição</button><button value="clear">Limpar tabela</button></form></dialog>
</main></body></html>
