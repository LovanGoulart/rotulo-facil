<style>
*{box-sizing:border-box}body{margin:0;font:18px/1.55 "DM Sans",system-ui,sans-serif;color:#16372f;background:#f6f6ee}header{background:#16463a;color:white;padding:19px max(6vw,20px);font-weight:750;letter-spacing:-.04em;font-size:25px}.mark{color:#ffe183;margin-right:8px}main{width:min(900px,92%);margin:clamp(25px,6vw,65px) auto 80px}h1,h2,h3,p{margin:0 0 14px}h1,h2{line-height:1.14;letter-spacing:-.045em}h1{font-size:clamp(2.1rem,6vw,3.9rem)}h2{font-size:clamp(1.65rem,4vw,2.3rem)}button,select,input{font:inherit;border:1px solid #677e73;border-radius:12px;padding:12px;min-height:50px;max-width:100%;color:inherit;background:white}button{font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #005bbc;outline-offset:3px}.choices,.row{display:flex;gap:12px;flex-wrap:wrap}.choices{margin:28px 0}.choice{flex:1 1 280px;border:0;padding:30px;text-align:left;font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;display:grid;gap:28px;background:#ffe6a1}.choice:last-child{background:#cfe8d7}.symbol{font-size:42px}.panel,article{background:white;border:1px solid #c6d2c8;border-radius:18px;padding:clamp(17px,4vw,32px);margin:18px 0}article{border-top:7px solid #26725b;overflow-wrap:anywhere}label{display:block;font-weight:650;margin:15px 0 4px}select,input:not([type=range]){width:100%}input[type=range]{width:100%;accent-color:#16463a}button[aria-pressed=true],.primary{background:#16463a;color:white}.back{margin-bottom:20px}#status{margin-top:16px;font-weight:650}li{margin-bottom:6px}[hidden]{display:none!important}dialog{width:min(92%,500px);border:1px solid #73877b;border-radius:18px;padding:24px;color:inherit}dialog::backdrop{background:#112d25aa}#preview{max-height:250px;max-width:100%;display:block;margin:12px auto}button:hover{filter:brightness(.96)}.metric{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:bold;color:#16463a}.muted{color:#486056}#periods button{flex:1 1 7 html{--topbar:56px;--notice:76px;scroll-padding-top:calc(var(--topbar) + var(--notice) + 24px)}
body{padding-top:calc(var(--topbar) + var(--notice))}
header{position:fixed;inset:0 0 auto;z-index:20;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}
header{display:flex;align-items:center;justify-content:space-between}
button{border-color:#a8bcb1;border-radius:14px;padding:11px 18px;box-shadow:0 2px 4px #183a2c10;line-height:1.35}
button:active:not(:disabled){transform:translateY(1px)}
#back,#backResult{display:grid;place-items:center;width:46px;height:46px;min-height:44px;padding:0;border-color:#649086;background:#234f43;color:white}
.show-analysis-result #installNote{display:none}
header nav{display:flex;gap:8px}
#distributorPicker{position:relative}
#distributorPicker::after{content:"";position:absolute;right:18px;top:19px;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);pointer-events:none}
#distributor{padding-right:40px}
#distributorOptions{position:absolute;z-index:5;top:100%;left:0;right:0;max-height:min(260px,32vh);overflow:auto;overscroll-behavior:contain;margin:4px 0 0;padding:4px;list-style:none;background:white;border:1px solid #a8bcb1;border-radius:12px;box-shadow:0 5px 16px #183a2c22}
#distributorOptions li{margin:0;padding:10px 12px;border-radius:8px}
#distributorOptions [role=option]{cursor:pointer}
#distributorOptions [role=option]:hover,#distributorOptions [role=option][aria-selected=true]{background:#e5f2ea}
#region{min-width:0}#reference{margin-top:12px}
.choice{border:1px solid #e7ce86;padding:clamp(22px,4vw,34px);border-radius:22px;box-shadow:0 5px 14px #183a2c0c}
.choice:last-child{border-color:#a6cdb6}
.symbol{width:64px;height:64px;display:grid;place-items:center;background:#ffffff80;border-radius:18px}
.row button{flex:1 1 auto}.primary,button[aria-pressed=true]{border-color:#16463a}
#resultActions,#mealActions,#editMeal{gap:10px}
#editMeal{display:flex;flex-wrap:wrap}#editMeal h3{width:100%}
#add{margin-top:14px}
.install-note{position:fixed;z-index:21;top:calc(var(--topbar) + 12px);left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;width:max-content;max-width:calc(100% - 24px);padding:2px 4px 2px 2px;background:#173f35;color:#fff;border:1px solid #315c50;border-radius:16px;box-shadow:0 8px 20px -7px #0c302954,inset 0 1px 0 #ffffff12}
.install-note button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:transparent;border:0;box-shadow:none;color:inherit;filter:none}
#installAction{gap:10px;padding:4px 15px 4px 5px;font:650 18px/1.2 system-ui,sans-serif;letter-spacing:-.02em;border-radius:13px}
.install-glyph{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#d4f3cf;color:#164d38}
#installText{text-decoration:none;padding:10px 12px;color:inherit;font-weight:650}
.install-note .close-note{position:relative;width:44px;padding:0;color:#cfdfd8;border-radius:10px}
.close-note::before{content:"";position:absolute;left:0;height:16px;border-left:1px solid #729688}
@media(hover:hover){.install-note button:hover{background:#285548}}
.install-note button:focus-visible{outline:3px solid #ffdb7e;outline-offset:0}
@media (display-mode: standalone){#installNote{display:none}}
</style></head><body><header><span><span class="mark" aria-hidden="true">◈</span>Rótulo Fácil</span><nav aria-label="Navegação"><button id="backResult" type="button" title="Voltar" aria-label="Voltar à análise" hidden><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7m-7 7h14"/></svg></button><button id="back" type="button" title="Início" aria-label="Ir para o início"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v18h5v-6h4v6h5V9"/></svg></button></nav></header><aside id="installNote" class="install-note" aria-label="Instalação do aplicativo"><a id="installText" href="/" target="_blank" rel="noopener" hidden>Abrir no app</a><button id="installAction" class="primary" type="button"><span class="install-glyph" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Instalar</button><button id="closeInstall" class="close-note" type="button" aria-label="Fechar aviso"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8m0-8-8 8"/></svg></button></aside><main>
<section id="home"><h1 tabindex="-1">O que você quer analisar?</h1><div class="choices"><button data-mode="energia" class="choice"><span class="symbol">⚡</span>Calcular Consumo de Energia</button><button data-mode="nutricao" class="choice"><span class="symbol">🥗</span>Analisar Tabela Nutricional</button></div></section>
<section id="work" hidden><h1 id="title" tabindex="-1"></h1>
<fieldset id="region" class="panel"><label for="distributor">Qual é a sua distribuidora de energia?</label>
<div id="distributorPicker">
<input id="distributor" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="distributorOptions" aria-describedby="reference" placeholder="Selecione ou digite o nome ou CNPJ" autocomplete="off" disabled>
<ul id="distributorOptions" role="listbox" aria-label="Distribuidoras de energia" hidden></ul>
</div><p id="reference" class="muted" role="status"></p><label for="rate">Valor exato da minha conta (R$/kWh, opcional)</label><input id="rate" inputmode="decimal" placeholder="Ex.: 0,95" aria-describedby="rateError"><p id="rateError" class="muted" role="status" hidden>Informe um valor em R$/kWh, por exemplo 0,95.</p></fieldset>
<div class="panel"><h2>Fotografe a etiqueta</h2><p id="tip"></p><div class="row"><button id="snap" class="primary">📷 Tirar foto</button><button id="pick">Escolher da galeria</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="gallery" type="file" accept="image/*" hidden>
<div id="confirmPhoto" hidden><img id="preview" alt="Prévia da foto selecionada"><button id="analyzeEnergy" class="primary" hidden>Analisar foto</button></div></div>
<div id="controls" class="panel" hidden><label for="hours">Horas ligado por dia · <output id="hoursLabel"></output></label><input id="hours" type="range" min="0" max="24" step=".25"><p id="basis"></p><h3>Ver consumo por período</h3><div id="periods" class="row"></div></div>
<div id="resultBox" hidden><article id="result" tabindex="-1"></article><div class="row" id="resultActions"></div></div>
<section id="mealBox" hidden><article id="meal"></article><div id="mealActions" class="row"></div><div id="editMeal" class="panel"></div></section>
</section>
<section id="resultScreen" aria-label="Resultado da análise" hidden><div id="foodControls" class="panel" hidden><label for="foodAmount">Quantidade a consumir · <output id="foodAmountLabel" for="foodAmount"></output></label><input id="foodAmount" type="range" min="0" max="4" step="0.25" value="1"><p id="foodBase"></p></div></section>
<p role="status" id="status"></p>
<dialog id="clearDialog" aria-labelledby="clearTitle"><h2 id="clearTitle">Limpar a refeição?</h2><p>Os alimentos adicionados serão removidos deste aparelho.</p><form method="dialog" class="row"><button value="cancel" autofocus>Manter refeição</button><button value="clear">Limpar tabela</button></form></dialog>
<dialog id="installHelp" aria-labelledby="installTitle"><h2 id="installTitle">Instalar o Rótulo Fácil</h2><p id="installSteps"></p><form method="dialog"><button>Entendi</button></form></dialog></main></body></html>
